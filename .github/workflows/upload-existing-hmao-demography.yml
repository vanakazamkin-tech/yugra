name: Upload existing HMAO demographic extract to Supabase staging

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/upload-existing-hmao-demography.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  upload:
    name: Upload verified extract to review staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified extraction artifact
        uses: actions/download-artifact@v4
        with:
          name: hmao-demography-extract
          path: demography-extract
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 44798377769

      - name: Upload review-only rows to Supabase staging
        env:
          SUPABASE_URL: https://dmbikidqikjupkghywbz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ops/upload_hmao_demography_staging.py

      - name: Upload staging report
        uses: actions/upload-artifact@v4
        with:
          name: hmao-demography-staging-report
          path: demography-extract/staging-upload-report.json
          if-no-files-found: error
          retention-days: 7
