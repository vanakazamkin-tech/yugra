name: Probe current HMAO BDPMO indicator members

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/probe-hmao-bdmo-members.yml"
      - "scripts/ops/probe_hmao_bdmo_core_members.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect only ZIP central directory
        run: python scripts/ops/probe_hmao_bdmo_core_members.py
