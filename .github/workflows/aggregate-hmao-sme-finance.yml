name: Aggregate FNS-derived SME counts and financial data for HMAO

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/aggregate-hmao-sme-finance.yml"
      - "scripts/ops/aggregate_hmao_sme_finance.py"
      - "scripts/ops/upload_hmao_sme_finance.py"
  workflow_dispatch:

concurrency:
  group: hmao-sme-finance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Aggregate municipal SME counts and annual legal-entity finances
        run: python scripts/ops/aggregate_hmao_sme_finance.py
      - name: Publish aggregate-only report
        if: always()
        shell: bash
        run: |
          if [ ! -f fns-sme-regional-aggregates/fns-sme-regional-aggregates.json ]; then
            mkdir -p fns-sme-regional-aggregates
            printf '{"status":"aggregation_failed"}\n' > fns-sme-regional-aggregates/fns-sme-regional-aggregates.json
          fi
          mkdir -p .ops-results
          cp fns-sme-regional-aggregates/fns-sme-regional-aggregates.json .ops-results/fns-sme-regional-aggregates.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ops-results/fns-sme-regional-aggregates.json
          if ! git diff --cached --quiet; then
            git commit -m "Record aggregate FNS SME regional financial results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmao-fns-sme-regional-aggregates
          path: fns-sme-regional-aggregates/fns-sme-regional-aggregates.json
          if-no-files-found: warn
          retention-days: 7
