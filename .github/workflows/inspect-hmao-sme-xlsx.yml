name: Inspect HMAO FNS SME regional workbook schema

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/inspect-hmao-sme-xlsx.yml"
      - "scripts/ops/inspect_hmao_sme_xlsx.py"
  workflow_dispatch:

concurrency:
  group: hmao-sme-xlsx-inspect-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Download HMAO workbook and inspect schema / aggregate metadata
        run: python scripts/ops/inspect_hmao_sme_xlsx.py
      - name: Publish schema inspection
        if: always()
        shell: bash
        run: |
          if [ ! -f sme-regional-probe/schema-inspection.json ]; then
            mkdir -p sme-regional-probe
            printf '{"status":"inspection_failed"}\n' > sme-regional-probe/schema-inspection.json
          fi
          mkdir -p .ops-results
          cp sme-regional-probe/schema-inspection.json .ops-results/hmao-sme-xlsx-schema.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ops-results/hmao-sme-xlsx-schema.json
          if ! git diff --cached --quiet; then
            git commit -m "Record HMAO SME workbook schema inspection"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmao-sme-xlsx-schema
          path: sme-regional-probe/schema-inspection.json
          if-no-files-found: warn
          retention-days: 7
