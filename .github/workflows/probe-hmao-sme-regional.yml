name: Probe regional FNS-derived SME dataset for HMAO

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/probe-hmao-sme-regional.yml"
      - "scripts/ops/probe_hmao_sme_regional.py"
  workflow_dispatch:

concurrency:
  group: hmao-sme-regional-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect archive directory using HTTP Range
        run: python scripts/ops/probe_hmao_sme_regional.py
      - name: Publish archive probe
        if: always()
        shell: bash
        run: |
          if [ ! -f sme-regional-probe/probe.json ]; then
            mkdir -p sme-regional-probe
            printf '{"status":"probe_failed"}\n' > sme-regional-probe/probe.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .ops-results
          cp sme-regional-probe/probe.json .ops-results/hmao-sme-regional-probe.json
          git add .ops-results/hmao-sme-regional-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record HMAO regional SME archive probe"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmao-sme-regional-probe
          path: sme-regional-probe/probe.json
          if-no-files-found: warn
          retention-days: 7
