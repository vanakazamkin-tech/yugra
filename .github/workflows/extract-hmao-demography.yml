name: Extract HMAO demographic indicators

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/extract-hmao-demography.yml"
      - "scripts/ops/extract_hmao_demography.py"
      - "scripts/ops/upload_hmao_demography_staging.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Download and filter HMAO municipality rows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract only the 22 Yugra municipalities
        run: python scripts/ops/extract_hmao_demography.py

      - name: Upload review-only rows to Supabase staging
        env:
          SUPABASE_URL: https://dmbikidqikjupkghywbz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ops/upload_hmao_demography_staging.py

      - name: Upload filtered rows and audit report
        uses: actions/upload-artifact@v4
        with:
          name: hmao-demography-extract
          path: demography-extract/
          if-no-files-found: error
          retention-days: 7
