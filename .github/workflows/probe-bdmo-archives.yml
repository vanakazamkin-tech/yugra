name: Probe BDPMO archive paths and indicator catalogue

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/probe-bdmo-archives.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official data archive endpoints
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import struct

          codes = ["8112001", "8112003", "8112004", "8112007", "8112008", "8112009", "8112027"]
          bases = [
            "https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20260928/regions",
            "https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20250918/regions",
          ]
          for base in bases:
            for code in codes:
              version = base.rsplit("_v", 1)[1].split("/")[0]
              name = f"data_Y4{code}_region71_112_v{version}.zip"
              url = f"{base}/{name}"
              try:
                req=Request(url,method="HEAD",headers={"User-Agent":"Yugra18-source-probe/1.0"})
                with urlopen(req,timeout=8) as response:
                  print("HEAD", code, response.status, response.headers.get("Content-Length"), response.headers.get("Content-Type"), url)
              except HTTPError as exc:
                print("HEAD", code, exc.code, url)
              except URLError as exc:
                print("HEAD", code, "URL_ERROR", exc, url)

          section_zip = "https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20260928/by_indicator/data_section31_112_v20260928.zip"
          section_zip_old = "https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20250918/by_indicator/data_section31_112_v20250918.zip"
          for candidate in [section_zip, section_zip_old]:
            try:
              req=Request(candidate,method="HEAD",headers={"User-Agent":"Yugra18-source-probe/1.0"})
              with urlopen(req,timeout=8) as response:
                print("SECTION31_HEAD",response.status,response.headers.get("Content-Length"),response.headers.get("Content-Type"),candidate)
            except Exception as exc:
              print("SECTION31_HEAD_ERROR",repr(exc),candidate)
          section_zip = section_zip_old
          try:
            req=Request(section_zip,method="HEAD",headers={"User-Agent":"Yugra18-source-probe/1.0"})
            with urlopen(req,timeout=8) as response:
              print("SECTION31_HEAD",response.status,response.headers.get("Content-Length"),response.headers.get("Content-Type"),section_zip)
          except Exception as exc:
            print("SECTION31_HEAD_ERROR",repr(exc),section_zip)
          try:
            req=Request(section_zip,headers={"User-Agent":"Yugra18-source-probe/1.0","Range":"bytes=-65536"})
            with urlopen(req,timeout=8) as response:
              tail=response.read()
              print("SECTION31_RANGE",response.status,response.headers.get("Content-Range"),len(tail))
              pos=tail.rfind(b"PK\\x05\\x06")
              if pos>=0 and len(tail)>=pos+22:
                entries=struct.unpack_from("<H",tail,pos+10)[0]
                cd_size=struct.unpack_from("<I",tail,pos+12)[0]
                cd_offset=struct.unpack_from("<I",tail,pos+16)[0]
                print("SECTION31_ZIP_DIRECTORY",entries,cd_size,cd_offset)
                if cd_size and cd_offset and cd_size < 10000000:
                  req=Request(section_zip,headers={"User-Agent":"Yugra18-source-probe/1.0","Range":f"bytes={cd_offset}-{cd_offset+cd_size-1}"})
                  with urlopen(req,timeout=15) as response:
                    directory=response.read()
                    found=[]
                    cursor=0
                    while cursor+46 <= len(directory):
                      if directory[cursor:cursor+4] != b"PK\\x01\\x02":
                        break
                      vals=struct.unpack_from("<4s6H3I5H2I",directory,cursor)
                      nlen,elen,clen=vals[10],vals[11],vals[12]
                      name=directory[cursor+46:cursor+46+nlen].decode("utf-8","replace")
                      if any(code in name for code in ["Y48112001","Y48112003","Y48112004","Y48112007","Y48112008","Y48112009","Y48112027"]):
                        found.append(name)
                      cursor += 46+nlen+elen+clen
                    print("SECTION31_MATCHING_ENTRIES",found[:200])
          except Exception as exc:
            print("SECTION31_RANGE_ERROR",repr(exc))

          sheet="https://docs.google.com/spreadsheets/d/1Z66eXdgzyBg2NPV4cRzrTtv6BSZFVaAi/export?format=xlsx"
          try:
            req=Request(sheet,method="HEAD",headers={"User-Agent":"Mozilla/5.0"})
            with urlopen(req,timeout=8) as response:
              print("CATALOGUE_SHEET",response.status,response.headers.get("Content-Length"),response.headers.get("Content-Type"),response.geturl())
          except Exception as exc:
            print("CATALOGUE_SHEET_ERROR",repr(exc))
          PY

      - name: Inspect official regional Rosstat page links
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from html.parser import HTMLParser

          class Links(HTMLParser):
            def __init__(self):
              super().__init__()
              self.links=[]
              self.current=None
            def handle_starttag(self, tag, attrs):
              if tag.lower()=="a":
                item=dict(attrs)
                self.current={"href":item.get("href",""),"text":""}
                self.links.append(self.current)
            def handle_data(self, data):
              if self.current is not None:
                self.current["text"] += data.strip()+" "

          for url in [
            "https://72.rosstat.gov.ru/ofs_demp_hmao",
            "https://72.rosstat.gov.ru/ofs_demp_ug",
            "https://72.rosstat.gov.ru/ofs_teru_hmao",
            "https://72.rosstat.gov.ru/dbscripts/munst/munst71/DBInet.cgi?pl=8112001",
            "https://72.rosstat.gov.ru/dbscripts/munst/munst71/DBInet.cgi?pl=8112003",
          ]:
            try:
              request=Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urlopen(request,timeout=8) as response:
                body=response.read().decode("utf-8","replace")
                parser=Links()
                parser.feed(body)
                print("\\nPAGE",url,"HTTP",response.status,"BYTES",len(body),"FINAL",response.geturl())
                for link in parser.links:
                  href=link["href"]
                  text=link["text"]
                  if any(k in (href+" "+text).lower() for k in [".xlsx",".xls",".pdf","рождаем","смерт","миграц","муницип"]):
                    print("LINK",text[:180],href)
            except HTTPError as exc:
              print("PAGE_HTTP_ERROR",url,exc.code)
            except URLError as exc:
              print("PAGE_URL_ERROR",url,repr(exc))
          PY
