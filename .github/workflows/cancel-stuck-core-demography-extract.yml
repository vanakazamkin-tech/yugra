name: Cancel superseded slow core-demography extractor

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/cancel-stuck-core-demography-extract.yml"

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel slow range-streaming run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: 44809488178
            });
            core.info("Cancelled superseded slow streaming extraction run 44809488178");
