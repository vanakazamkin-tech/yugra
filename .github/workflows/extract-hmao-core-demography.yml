name: Extract core HMAO demographic indicators from current BDPMO archive

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/extract-hmao-core-demography.yml"
      - "scripts/ops/extract_hmao_municipality_core_demography.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Range-extract six demographic indicators for 22 Yugra municipalities
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract indicator CSV members via HTTP Range
        run: python scripts/ops/extract_hmao_municipality_core_demography.py

      - name: Upload six-indicator municipal extract and audit report
        uses: actions/upload-artifact@v4
        with:
          name: hmao-core-demography-2026-extract
          path: demography-core-2026-extract/
          if-no-files-found: error
          retention-days: 7
