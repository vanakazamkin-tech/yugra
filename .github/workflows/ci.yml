name: Build verification

on:
  push:
    branches: [main, feature/municipal-data-coverage-matrix, 'fix/**', 'feat/**']
  # Keep incremental fix branches covered by the same regression and build checks.
  # Classification tests protect geography, sector semantics, and the six-pillar mapping.
  # The same workflow is used for data-classification and risk-chain regression updates.
  # Recheck expanded business and labour indicator families after classifier refinement.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check migration staging script syntax
        run: node --check scripts/prepare-rosstat-migration-import.mjs
      - name: Test migration staging filters
        run: node scripts/test-rosstat-migration-staging.mjs
      - name: Test forecast coverage classification
        run: node scripts/test-forecast-coverage.mjs
      - name: Test risk data provenance and geography gates
        run: node scripts/test-risk-data-gates.mjs
      - name: Test indicator classification and resilience model pillars
        run: node scripts/test-risk-model-pillars.mjs
      - name: Test six-pillar resilience index methodology
        run: node scripts/test-resilience-index.mjs
      - name: Validate Rosstat municipality crosswalk
        run: node scripts/validate-rosstat-crosswalk.mjs
      - name: Test official comparison comparability
        run: node scripts/test-official-comparison-gates.mjs
      - name: Test analytical report official-data gates
        run: node scripts/test-report-official-data-gates.mjs
      - name: Test municipality passport data integrity
        run: node scripts/test-municipality-passport-gates.mjs
      - name: Test operational registry data integrity
        run: node scripts/test-operational-registry-gates.mjs
      - name: Build production bundle
        run: npm run build
