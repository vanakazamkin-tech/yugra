name: Build verification

on:
  push:
    branches: [main, feature/municipal-data-coverage-matrix, 'fix/**', 'feat/**', 'integration/yugra18-six-directions-2026-11-07']
  # Keep incremental fix branches covered by the same regression and build checks.
  # Classification tests protect geography, sector semantics, and the six-pillar mapping.
  # The same workflow is used for data-classification and risk-chain regression updates.
  # Recheck expanded business and labour indicator families after classifier refinement.
  pull_request:
    branches: [main, integration/yugra18-six-directions-2026-11-07]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test data provenance and source catalog contracts
        run: npm run test:data-quality
      - name: Check migration staging script syntax
        run: node --check scripts/prepare-rosstat-migration-import.mjs
      - name: Test migration staging filters
        run: node scripts/test-rosstat-migration-staging.mjs
      - name: Test forecast coverage classification
        run: node scripts/test-forecast-coverage.mjs
      - name: Audit risk pilot CSV structure and coverage
        run: node scripts/check-risk-pilot-csv.mjs
      - name: Test risk data provenance and geography gates
        run: node scripts/test-risk-data-gates.mjs
      - name: Test indicator classification and resilience model pillars
        run: node scripts/test-risk-model-pillars.mjs
      - name: Test six-pillar resilience index methodology
        run: node scripts/test-resilience-index.mjs
      - name: Validate Rosstat municipality crosswalk
        run: node scripts/validate-rosstat-crosswalk.mjs
      - name: Test official comparison comparability
        run: node scripts/test-official-comparison-gates.mjs
      - name: Test analytical report official-data gates
        run: node scripts/test-report-official-data-gates.mjs
      - name: Test municipality passport data integrity
        run: node scripts/test-municipality-passport-gates.mjs
      - name: Test operational registry data integrity
        run: node scripts/test-operational-registry-gates.mjs
      - name: Check municipality map coverage
        run: |
          node --check scripts/check-map-coverage.mjs
          npm run check:map-coverage
      - name: Build production bundle
        run: npm run build

  data-migrations-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yugra_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yugra_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: yugra_migration_test
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bootstrap disposable Supabase-like schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/data_quality_migrations_bootstrap.sql
      - name: Apply provenance and uniqueness migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106210000_data_quality_provenance_guardrails.sql
      - name: Apply quality diagnostics view migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106230000_add_municipality_indicator_quality_view.sql
      - name: Apply source catalog metadata migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106233000_extend_data_source_provenance_metadata.sql
      - name: Reapply migrations to verify idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106210000_data_quality_provenance_guardrails.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106230000_add_municipality_indicator_quality_view.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106233000_extend_data_source_provenance_metadata.sql
      - name: Verify migration effects, security grants, and uniqueness behavior
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/data_quality_migrations_assertions.sql
      - name: Execute read-only post-migration audit against integration schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/audits/data-quality-post-migration-audit.sql
      - name: Verify standalone legacy-index compatibility
        run: |
          createdb yugra_migration_test_legacy_index
          PGDATABASE=yugra_migration_test_legacy_index psql -v ON_ERROR_STOP=1 -f supabase/tests/data_quality_migrations_bootstrap_legacy_index.sql
          PGDATABASE=yugra_migration_test_legacy_index psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106210000_data_quality_provenance_guardrails.sql
          PGDATABASE=yugra_migration_test_legacy_index psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106230000_add_municipality_indicator_quality_view.sql
          PGDATABASE=yugra_migration_test_legacy_index psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106233000_extend_data_source_provenance_metadata.sql
          PGDATABASE=yugra_migration_test_legacy_index psql -v ON_ERROR_STOP=1 -f supabase/tests/data_quality_migrations_assertions.sql

