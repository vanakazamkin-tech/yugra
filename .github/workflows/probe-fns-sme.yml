name: Probe FNS SME registry schema and municipal fields

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/probe-fns-sme.yml"
      - "scripts/ops/probe_fns_sme_registry.py"
  workflow_dispatch:

concurrency:
  group: fns-sme-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect XSD and sample XML members through HTTP Range
        run: python scripts/ops/probe_fns_sme_registry.py

      - name: Publish safe schema probe report
        if: always()
        shell: bash
        run: |
          if [ ! -f fns-sme-probe/fns-sme-probe.json ]; then
            mkdir -p fns-sme-probe
            printf '{"status":"probe_failed_before_report"}\n' > fns-sme-probe/fns-sme-probe.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .ops-results
          cp fns-sme-probe/fns-sme-probe.json .ops-results/fns-sme-probe.json
          git add .ops-results/fns-sme-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record FNS SME registry schema probe"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save probe report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fns-sme-registry-probe
          path: fns-sme-probe/fns-sme-probe.json
          if-no-files-found: warn
          retention-days: 7
