name: Cancel duplicate HMAO staging upload

on:
  push:
    branches:
      - ops/extract-hmao-demography-2026-11
    paths:
      - ".github/workflows/cancel-duplicate-hmao-staging.yml"

permissions:
  actions: write

jobs:
  cancel_duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel redundant upload run
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 44800658490;
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            core.info(`Cancelled redundant staging upload run ${runId}`);
